name: motore-sfida
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: motore
  cancel-in-progress: false
jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "-5364252201"
      SFIDA_CMD_CHAT: "-1004394754702"
      SFIDA_STATE_CHAT: "-1004324571713"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q requests matplotlib numpy
      - run: python gh_run.py
